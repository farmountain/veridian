# Veridian's own gate.
#
# The source tree is still the program - Node 22 strips types and runs .ts
# directly, so `npm run gate` is typecheck-then-tests and nothing else. What
# changed is that the *distributed* artifact is now compiled: `npm run build`
# emits dist/ for the npm package and for the container image, because Node 22
# refuses to strip types under node_modules.
#
# Eight jobs, because they answer different questions:
#   gate   - does the source still hold? Runs on both platforms that matter.
#   demo   - does the product still do the thing it exists to do? Needs a
#            browser, so it is separate and does not slow the gate down.
#   worlds - do the browserless worlds still demo green? None of the twelve
#            needs Playwright, and before this job existed no CI ran any of
#            them: "passes on a developer's machine" is a claim about a machine.
#   dist   - does the artifact we would publish actually work? Compiled
#            JavaScript is touched by no unit test, and npm reads `files` and
#            `bin` in ways the source tree never exercises.
#   mcp    - does the MCP surface actually run? Its whole interface is a child
#            process reading stdin and writing stdout, so the suite can prove
#            the dispatcher and not the program. No build: the source is it.
#   image  - does the container build and run? Docker is not installed on the
#            maintainer's machine, so CI is the only place this can be proven,
#            and a Dockerfile that has never been built is a claim.
#   cockpit - does the VS Code extension still hold? It is a third runtime with
#            its own tsconfig, its own suite and its own compiled artifact, and
#            the root `gate` job neither typechecks nor tests it: the root
#            tsconfig excludes extension/**. Two gates, because they are two
#            programs in one repository. It also packages the extension and
#            reads the archive back, because the `.vsix` is a third artifact no
#            test in either tree can load: there is no VS Code test host here.
#   isolation - can a substrate refuse what this host allows? The `gate` job
#            runs the same suites, but on a machine with no runtime they skip
#            with a stated reason - and a skipped boundary check and a passed
#            one print the same green. So this is the job whose subject is the
#            substrate itself, and it requires `# skipped 0` rather than merely
#            a zero exit. Its predecessor in this shape is the `upload the
#            evidence bundle` step that uploaded nothing for every green build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run gate

  demo:
    name: canonical demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Playwright is deliberately not a dependency. This is the one bootstrap
      # that downloads it, and it is the same command a developer runs.
      - run: npm run e2e:install
      # Exit 0 only when all four criteria pass with their evidence present.
      - run: npm run demo
      # This one exits 2 by design: every criterion is a browser observation,
      # so the loop must refuse to judge. Asserting the refusal keeps
      # "INCONCLUSIVE is not PASS" enforced by CI instead of by prose.
      # `set +e` because Actions runs bash with -e and a 2 would abort the
      # script before the exit code could be read.
      - name: --browser none must exit 2, never 0
        run: |
          set +e
          npm run demo:no-browser
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 (INCONCLUSIVE) from --browser none, got $code"
            exit 1
          fi
      - name: upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridian-evidence
          path: .veridian/
          # `include-hidden-files` is not decoration: `.veridian/` is a *hidden* directory, and
          # upload-artifact v4 excludes hidden files by default. Without this the step ran on every
          # green build, printed "No files were found with the provided path: .veridian/", and
          # uploaded nothing - a step named "upload the evidence bundle" that had never uploaded an
          # evidence bundle, sitting in a list of warnings a reader learns to skip. Found by watching
          # the first run of this commit rather than by reading the workflow.
          include-hidden-files: true
          # `error`, not `warn`, for the same reason: the run just wrote a bundle, so an empty path
          # means the thing this step exists to carry is not there. A warning would let that pass.
          if-no-files-found: error
          retention-days: 7

  worlds:
    name: browserless worlds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The one demo whose application is a *build product*: the twelfth demo stages the compiled
      # Cockpit out of `extension/vscode` into the extension host world, so `out/` has to exist before
      # the loop reaches `cockpit`. `demo:cockpit` refuses by name when it is absent rather than
      # skipping, because a skipped check reports a green suite - which is why the build is a step the
      # workflow owns and not something the demo quietly does for its reader.
      - name: build the Cockpit, so the one demo with a build prerequisite has an artifact
        run: npm ci && npm run build
        working-directory: extension/vscode
      # Veridian judged by Veridian: the one contract whose application is the CLI itself, run twice
      # inside one invocation. It is not a `demo:*` script, so the `for world` loop below cannot carry
      # it, and this step is what keeps it from being a command the manifest declares and nothing
      # executes - a defect this repository has now paid for four times (`db.query`, `db.rowCount`,
      # `web.visible`, and the four demos no CI job ran).
      #
      # It sits *above* the loop rather than after it on purpose. Every run in this job writes the same
      # `.veridian/latest-result.json`, and the upload step at the end carries the whole of `.veridian/`
      # - so the reading a reader opens first is whichever run wrote that file last, and the world
      # comment below wants that to be `cockpit`. Added after the loop, this step becomes the last
      # writer instead, and the artifact's own comment would go on describing a bundle it no longer
      # carried.
      #
      # The *second* run is the check, and it is why this is a script rather than a bare `veridian
      # validate`. `#rebuild` in `adapters/local-process` empties the sandbox at `create()`, so run 1
      # starts clean on every machine; run 1 then leaves its own `config.yaml` behind, because nothing
      # removes the tree at the end of a run - only at the start of the next one. So run 2 inherits
      # exactly the state run 1 wrote, here as much as anywhere. A single run on this fresh checkout
      # would pass over a world that never rebuilt at all.
      - name: Veridian must accept its own contract, twice in a row
        run: npm run acceptance
      # The second acceptance route, and it judges something the step above cannot: not the command
      # line as a *product* but a *run* as a witness. Where that contract asks "does Veridian work",
      # this one asks "does a run resolve its own gaps, record the rung each resolution reached, carry
      # a reason for what it deferred, bound the rungs it attempted and report every origin it can
      # raise" - and it asks it of a **nested** run, so the outer world is a `local-process` host
      # running the CLI and the inner one is a `local-process` host the CLI started itself. Neither
      # route would have found the other's defects, which is why both are here rather than one.
      #
      # Run twice for the reason the step above is a script: `#rebuild` empties a sandbox at
      # `create()`, so run 1 starts clean on every machine and run 1 then leaves its own state behind,
      # because nothing removes the tree at the end of a run - only at the start of the next one. A
      # single run would pass over a world that never rebuilt at all.
      #
      # It sits above the loop alongside the step above, and it is worth being precise about *why* it
      # does not contend for the single-slot summary either way: `scripts/ladder.mjs` passes
      # `--state-dir sandbox/ladder/outer`, a sibling of the sandbox rather than a descendant of it,
      # so this route writes nothing into `.veridian/` at all and the artifact below cannot carry its
      # bundle. The exit code is the check here; the ordering is still asserted rather than assumed,
      # because an assertion about a *place* is what keeps the next edit from moving it.
      #
      # Measured on this machine before it was added: ~21 s wall for both passes, each pass running
      # the inner contract four times. Cheap enough that leaving it out of CI would be the expensive
      # choice - and leaving it out was the state this step corrects: `acceptance:ladder` was
      # declared, shipped and runnable while no pipeline executed it, which is this repository's
      # oldest shape.
      #
      # It has now run on a runner, and it was green on its first attempt - run `35422903806`, both
      # invocations `exit 0 - PASS  (COMPLETED, 1 iteration(s))`. That matters because "avoids by
      # construction" was a reading of the code rather than a measurement when it was written, and
      # the forecast it made was that this contract avoids the two ubuntu-only shapes the workflow's
      # own first run found (`resolveSibling` dropping a POSIX root, and a test building a repo root
      # from `url.pathname` with the leading separator stripped): its `process.argv` needle compares
      # the vector the *criterion* wrote rather than a resolved path, and its file targets are
      # world-relative and split on `/`. The forecast held.
      #
      # The self-acceptance step **above** did not, and the contrast is the useful part of this note:
      # the contract route failed on its first runner execution with `run 1: exit 1 - FAIL
      # (MAX_ITERATIONS, 1 iteration(s))`, for a cause with nothing to do with the platform - a `cli/`
      # extraction had dropped a log line its AC-006 asserted. Two self-acceptance routes, one green
      # first time and one red, and the one that went red was red because something asserted a
      # *behaviour* rather than a shape.
      - name: Veridian must resolve its own ambiguities, twice in a row
        run: npm run acceptance:ladder
      # Twelve of the fourteen declared demos, and until this job existed **none of them was run by
      # CI** - the `demo` job above covers the canonical browser demo and `--browser none`, and nothing
      # else. Every one of these passes on a developer's machine, and "passes on a developer's machine"
      # is a claim about one machine: this project has already paid twice for a check that had never run
      # (the workflow that had never executed, and the upload step that uploaded nothing for every green
      # build before it).
      #
      # The job was named `simulated worlds` and ran seven, which was the number of `sim-*` worlds when
      # it was written. It is now named for the property it actually tests - that none of them needs a
      # browser - because that name had stopped describing its own membership twice over: `local-api`,
      # `local-process` and `environment-twin` stand nothing in at all, and `api`, `local-process`,
      # `data` and `cockpit` were declared, shipped, documented and run by nothing. That is this
      # repository's oldest shape, one layer out: *a roster and the thing that executes it are two lists
      # of the same thing, and only one of them can be executed.* A name that states the wrong property
      # is the same defect as a step whose name states an outcome it does not check.
      #
      # None of the thirteen needs Playwright, which is why this job does not install it. That is a real
      # property of the worlds and not a convenience: the browser is the *first* world's observation
      # port, and every other world declares its own.
      #
      # `set +e` around each run because Actions runs bash with `-e`, which would abort on the first
      # non-zero before the assertion could name the world that produced it. A failure here has to say
      # *which* world regressed - a job that only says "a demo failed" sends the reader to run twelve
      # commands to find out which one.
      #
      # `twin` is the newest member and the only one whose subject is not an application: it measures
      # the *machine* the run stands on - the runtime, the filesystem confinement, the network
      # allowance, the tools on `PATH` - and writes a twin. It belongs in this job rather than in the
      # gate because it starts a real child process and reaches nothing else, and because its own
      # defects are defects in the probe rather than in an application, which makes it the one demo
      # whose failure could otherwise look like a machine difference rather than a regression.
      #
      # `audit` is the newest and the one that would be least safe to leave unrun here. Its subject is a
      # real tree outside the world's sandbox - the checkout CI is standing in - so it is the only demo
      # that reads the workspace and the only one that could damage it. What keeps it safe is a
      # boundary the runtime enforces rather than a promise: the observed tree joins the read
      # allowance and never the write allowance, and AC-003 measures the refusal while AC-004 measures
      # a successful write into the sandbox beside it. A regression that widened the allowance would
      # have to fail AC-003 first, which is why this job is where a widened allowance would be caught.
      # `env` is the one that would be easiest to leave unrun and the one whose absence would matter
      # most. It declares `process.environment: declared`, so its application is started with a map the
      # world chose rather than the operator's shell, and it reads that map back through a crawl whose
      # completeness was wrong when it was first written: `spawn` with six names gives a Windows child
      # seventeen, so the crawl reported `inherited: 0` for a program that had inherited `USERNAME` and
      # `LOGONSERVER` from the operating system. That was found by two instruments disagreeing - the
      # crawl said 6, the program's own census said 17 - and it is exactly the kind of difference this
      # job's platform is best placed to notice, because the baseline it names was measured on Windows
      # and this runner is Ubuntu. If the platform's floor differs here, the assertion that the crawl
      # equals the child's view fails by name rather than shortening the reading quietly.
      - name: every world must demo green, and say which one did not
        run: |
          set +e
          failed=""
          for world in db k8s posix os cloud container vscode api local-process data cockpit mobile twin audit env; do
            echo "::group::npm run demo:$world"
            npm run "demo:$world"
            code=$?
            echo "::endgroup::"
            if [ "$code" -ne 0 ]; then
              echo "demo:$world exited $code"
              failed="$failed $world"
            fi
          done
          set -e
          if [ -n "$failed" ]; then
            echo "these worlds did not demo green:$failed"
            exit 1
          fi
      # The artifact carries every run this job made, not one: `.veridian/runs` holds a directory per
      # run and nothing removes them, so it holds twelve demo bundles plus the *two* the
      # self-acceptance contract writes, because that contract is invoked twice. What is single-slot
      # is `.veridian/latest-result.json` - the summary an external agent reads first - and it is
      # written by whichever run went last, which is why `cockpit` is ordered last above and why the
      # self-acceptance step sits above the loop. So the *latest* reading in the artifact is the
      # Cockpit's, the only demo whose application is Veridian's own client.
      #
      # One route this job runs is deliberately *not* in here, and the omission is a decision rather
      # than an oversight: `npm run acceptance:ladder` passes `--state-dir sandbox/ladder/outer`, a
      # sibling of the sandbox it builds, so its bundle lands under the git-ignored `sandbox/` and
      # never touches `.veridian/`. Its step's exit code is the check. A reader who expects four
      # criteria' worth of ladder evidence to be in this archive is looking for a file this job was
      # never asked to carry.
      #
      # The name says "worlds" rather than "sim" because three of the twelve stand nothing in - `db` is
      # a real SQLite file, `api` a real service and `local-process` a real program - and the job also
      # runs Veridian's own two self-acceptance routes, which are real too.
      - name: upload every world's evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veridian-worlds-evidence
          path: .veridian/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  isolation:
    name: isolation substrate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The substrate this checks is whatever runtime answers a *server* version - `podman` first,
      # then `docker` - and this runner has Docker preinstalled with its daemon up, which is why the
      # job needs no setup step of its own. It is stated rather than assumed because the assertion
      # below turns on it: a runner image that stopped shipping a runtime has to fail here loudly
      # rather than skip its way to a green tick.
      - name: the substrate must be able to refuse what this host allows
        run: node scripts/probe-isolation.ts
      # Not the whole gate - the `gate` job runs that on both platforms - but the two suites whose
      # subject is this seam, plus the refusal that matters most: `# skipped 0`. These tests skip with
      # a stated reason when no runtime is present, which is honest on a developer's laptop and is a
      # **defect on a runner that is supposed to have one**, because a skipped boundary check and a
      # passed boundary check print the same green. The original of this shape in this repository is
      # the `upload the evidence bundle` step that uploaded nothing for every green build, and the
      # countermeasure is the same: assert that the thing ran, not that nothing failed.
      - name: the seam's own suites must run, not skip
        run: |
          set +e
          node --test tests/process-isolation.test.ts tests/isolation.test.ts > isolation.log 2>&1
          code=$?
          set -e
          cat isolation.log
          grep -E '^# (tests|pass|fail|skipped)' isolation.log
          if [ "$code" -ne 0 ]; then
            echo "the isolation suites exited $code"
            exit 1
          fi
          if ! grep -q '^# skipped 0$' isolation.log; then
            echo "a substrate test skipped on a runner that has a runtime, so the boundary was not measured"
            exit 1
          fi
      # And the world's own reading, end to end: a `local-process` world with the substrate declared
      # reports which runtime held it and calls its network boundary enforced - which is the one
      # answer that world has never been able to give on any machine, because `node --allow-net` does
      # not exist. The `gate` job runs this suite too, off a device where the substrate tests skip;
      # this step is what turns the skip into a measurement.
      - name: the world must report the substrate that held it
        run: |
          set +e
          node --test tests/local-process-environment.test.ts > world.log 2>&1
          code=$?
          set -e
          cat world.log
          grep -E '^# (tests|pass|fail|skipped)' world.log
          if [ "$code" -ne 0 ]; then
            exit 1
          fi
          if ! grep -q '^# skipped 0$' world.log; then
            echo "the substrate reading skipped, so the world's network answer was not measured either"
            exit 1
          fi

  dist:
    name: distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      # Drives the compiled CLI from a fresh temporary directory and requires
      # exit 2 from a browserless run. Exit 3 would mean the built CLI could not
      # find the schemas it shipped with - the failure an installed CLI would
      # have had, and the reason the `bin` entry cannot point at the sources.
      - run: npm run smoke:dist
      # Then the same thing through npm itself. This is the only check that
      # reads the `files` allowlist and the `bin` entry the way a consumer does,
      # and the only one that would notice a `dist/` that failed to reach the
      # tarball.
      - name: the packed tarball must install and run somewhere else
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/veridian-*.tgz
          ./node_modules/.bin/veridian help

  mcp:
    name: MCP surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The fourth artifact check, and the only one whose artifact is a running
      # program rather than a file. `mcp/server.test.ts` holds the surface's
      # decisions against an injected context, which is the half a `node --test`
      # file can be; what no fake can prove is that the *program* works, so this
      # spawns the real server as a child and drives it over a real pipe. It
      # needs no build, because the source tree is the program.
      - run: npm run smoke:mcp

  image:
    name: container image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build the image
        run: docker build -t veridian:ci .
      # The image's default command is `help`.
      - name: the image must run the CLI
        run: |
          set +e
          docker run --rm veridian:ci
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "expected exit 0 from the containerised CLI, got $code"
            exit 1
          fi
      # `help` prints text and loads no schema, so on its own it would pass for
      # an image that shipped no schemas at all. This mounts the example goal
      # read-only from outside the image and requires the browserless exit 2 -
      # which is only reachable if the schemas inside /app/dist resolved. The
      # mount is deliberately the *goal*, not the schemas: an image that read
      # its contracts from the mount would not be a distribution.
      - name: the image must resolve its own schemas, not the mount's
        run: |
          set +e
          docker run --rm \
            -v "$GITHUB_WORKSPACE/examples:/work/examples:ro" \
            veridian:ci validate \
              --goal /work/examples/shopping-cart/goal.yaml \
              --state-dir /tmp/.veridian \
              --browser none --no-repair
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "expected exit 2 from a browserless run in the container, got $code"
            exit 1
          fi

  cockpit:
    name: VS Code Cockpit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # Two lockfiles, two caches. Without this the extension install would
          # fall back to no cache and re-resolve the tree on every run.
          cache: npm
          cache-dependency-path: extension/vscode/package-lock.json
      - run: npm ci
      # typecheck, test, build, smoke:out - in that order. The unit suite runs
      # .ts and the extension host runs out/*.js, so the compiled artifact is
      # reached by `npm run smoke:out` and by nothing else. It loads that
      # artifact against a recording double of `vscode` and asserts the
      # registered commands are exactly the six the manifest declares.
      #
      # What this job therefore does NOT prove: anything about the real VS Code
      # API, the palette, the status bar's rendering, workspace trust or
      # multi-root workspaces. There is no VS Code test host here, and
      # extension/vscode/README.md names that gap rather than implying it away.
      - run: npm run gate
      # The gate builds `out/` and loads it. It does not build the archive, and
      # the archive is a different artifact produced by a different tool from an
      # allowlist in the manifest - so it is covered by a check of its own, and
      # that check runs here rather than in `gate` for the reason the root
      # repository keeps `smoke:dist` out of its own gate: a packaging tool's
      # output is not part of the source tree's contract, and running `vsce` on
      # every local gate run would make the gate depend on it.
      #
      # `smoke:vsix` reads the archive as a zip and asserts that the entry point
      # the manifest names is inside it, that the manifest inside it agrees with
      # the one on disk field for field, that no source file, test file or
      # installed dependency travelled with it, that the licence did, and that
      # every compiled file it carries is byte-identical to the build's - which
      # is what makes a stale archive a failure rather than a silent second copy.
      - run: npm run package
      - run: npm run smoke:vsix
      - name: upload the packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: veridian-cockpit-vsix
          # A glob, because `vsce` names the archive `<name>-<version>.vsix` out of the manifest it
          # packages - so a version bump moves the path, and a literal one here would upload
          # nothing on every release after the next.
          path: extension/vscode/*.vsix
          # A step whose name states an outcome must fail when that outcome does
          # not happen. The default is `warn`, and this repository has already
          # carried a green run whose artifact step uploaded nothing.
          if-no-files-found: error
