# How to create, start, observe and reset one environment instance.
#
# This is the sixth world Veridian ships and the fourth one that is explicitly *simulated*. It exists to
# answer a question the other three cannot: does the environment layer admit a world whose subject is a
# **remote provider account** rather than a cluster or a machine - a world where the interesting state
# is a set of resources an application created over an API, and where almost nothing about the state is
# a file on this disk?
#
# Read this next to `schemas/environment.schema.json`: there is no `version` key, and the document is
# closed to unknown keys, because an environment definition describes a running world rather than being
# a versioned contract of its own.

# `sim-cloud` binds a real HTTP server that speaks a provider's own routes over loopback, runs the
# application's own provisioning program against it, and decides every permission question with the
# account's own evaluator. The substitution is declared in every reading.
adapter: sim-cloud

# Relative to this file. The adapter runs `start` with the working directory set here, so the program
# `args` names is resolved inside the application and nowhere else.
app: app

# There is no address to probe over HTTP and saying so is the point rather than an omission: the
# application is not a server, it is a program that makes requests *to* a server. A `url` here would
# make the loader infer a browser, and a browser criterion over an application that serves no page is
# the `--browser none` defect one world further out. Readiness is decided by the application's own
# output instead, which is what `start.readyPattern` names below.
url: null

# Null means "this app has no dependencies to install". The world's control plane is an HTTP server
# built on `node:http`, and the application's provisioner uses the platform's own `fetch`, so the demo
# runs from a clean checkout with nothing to fetch - and no socket is opened to a real provider either.
dependencyInstall: null

# The account this world stands in for.
#
# Stated in the environment document rather than as an adapter-private option so that every reader of
# the run - the adapter, the bundle, a failure report - names the *same* provider, region, account and
# principal, and so that "this world is not a provider" stays distinguishable from "nobody filled the
# field in". All four keys are required: an account with no region would hold resources in no region,
# and an account with no principal would have no caller for its own writes.
cloud:
  # Recorded in every reading, because the first question asked of a cloud result is which provider.
  # A substitute answering on 127.0.0.1 must be visibly a substitute rather than an unnamed one.
  provider: sim-provider
  # The one region this account holds. `s3.createBucket` refuses a bucket naming a different region
  # rather than silently creating it elsewhere, so a program that pasted the wrong region into a
  # request is told so instead of having its mistake recorded as a resource that exists.
  region: sim-region-1
  # The account whose resources are being described and whose meter is being read.
  account: cart-account
  # The identity the substitute treats as its own caller. It is deliberately not one of the five names
  # the loader refuses as privileged (`root`, `account-root`, `owner`, `administrator`, `admin`): an
  # account whose caller is the administrator is one where every permission criterion passes for a
  # reason that has nothing to do with the policy under test, so a hardening contract judged as one
  # would be vacuous.
  principal: svc-cart

start:
  # Executed verbatim - never a shell string built by pasting configuration into it.
  command: node
  args:
    - provision.mjs
  # Wait for the provisioning program to say it finished, and to say how much it provisioned. This is a
  # fact about the world; a sleep is a race, and a race is how run-to-run consistency is lost.
  #
  # The count is `\d+` rather than a specific number on purpose. A pattern naming one resource would
  # make a world that provisioned nine of its ten resources report a failure to come up, and the
  # criterion asking about the tenth would never be reached - the defect would arrive as an environment
  # failure instead of as the criterion that read it. The number is still required to be there, because
  # "provisioned" with no count is a program that exited after announcing nothing.
  readyPattern: 'cart-cloud provisioned: \d+ resources to .+'

health:
  # No `path` and no `expectStatus`. There is no route to poll - the application answers on none - so
  # the adapter's readiness signal is the provisioning program's own exit and readiness line, and a
  # status code would be a number nothing ever produced.
  timeoutMs: 30000
  intervalMs: 100

reset:
  # The account is cleared back to its declared state and the application is run again from scratch.
  # `restart` rather than `snapshot-restore` on purpose: the world can say what a clean account is -
  # that is what `clear()` and the re-seed of the declared principal compute - and claiming a snapshot
  # the substitute does not take would be a stronger promise than the implementation makes.
  strategy: restart
